name: Daily Stock Screener

on:
  schedule:
    # 【测试中】UTC 03:10 = 美东 11:10 PM (EDT)
    # 测完改回: '15 0 * * 2-6'  (美东 8:15 PM 周一至周五)
    - cron: '10 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-screener:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 运行筛选并发送邮件
        env:
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
        run: python daily_screener_email.py

      - name: 若罗素1000缓存有更新则提交回仓库
        if: always()
        run: |
          if [[ -n "$(git status --porcelain russell1000_cache.csv)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add russell1000_cache.csv
            git commit -m "自动更新罗素1000成分股缓存"
            git push
            echo "缓存已更新并提交"
          else
            echo "缓存无变化，跳过提交"
          fi

      - name: 保存 Excel 备份
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screener-result
          path: '*.xlsx'
          if-no-files-found: ignore
          retention-days: 30
