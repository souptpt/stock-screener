name: Daily Stock Screener

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-screener:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 运行筛选并发送邮件
        env:
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
        run: python daily_screener_email.py

      - name: 提交历史名单与罗素1000缓存
        if: always()
        run: |
          if [[ -n "$(git status --porcelain screen_history.csv russell1000_cache.csv)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add screen_history.csv russell1000_cache.csv
            git commit -m "更新每日名单快照"
            git pull --rebase --autostash
            git push
            echo "已提交"
          else
            echo "无变化，跳过提交"
          fi

      - name: 保存 Excel 备份
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screener-result
          path: '*.xlsx'
          if-no-files-found: ignore
          retention-days: 30
